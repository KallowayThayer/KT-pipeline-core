name: KT-Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.x"
        cache: "npm"
    - name: Install Dependencies
      run: npm ci
    - name: Run Type Check
      run: npx tsc --noEmit
    - name: Run Performance Benchmark
      run: npm run bench
